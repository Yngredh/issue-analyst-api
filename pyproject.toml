[project]
name = "issue_analyst_api"
version = "0.1.0"
description = "Entrada de issues do GitHub: recebe, valida e encaminha para o processo de triagem."
readme = "README.md"
authors = [
    { name = "Yngredh", email = "yngredh.cruz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.2.3",
    "fastapi>=0.162.4",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "testcontainers[postgres,rabbitmq]>=4.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
